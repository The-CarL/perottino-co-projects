<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Country Code Desk</title>
  <style>
    body { margin: 0; background: #f4f7fb; color: #172b43; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 3rem auto; padding: 0 1.25rem; }
    h1 { line-height: 1.2; margin-bottom: .5rem; }
    label { display: block; font-weight: 650; margin-bottom: .5rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .75rem; }
    input, button { font: inherit; border: 1px solid #526882; border-radius: .4rem; padding: .55rem .75rem; }
    input { flex: 1 1 12rem; min-width: 0; color: inherit; background: #fff; }
    button { background: #173c68; color: #fff; cursor: pointer; }
    :focus-visible { outline: 3px solid #0b56ab; outline-offset: 3px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 1rem; background: #fff; border: 1px solid #b8c7d8; border-radius: .4rem; padding: .7rem 1rem; margin-bottom: .5rem; }
    strong { letter-spacing: .08em; }
  </style>
</head>
<body>
  <main>
    <h1>Country Code Desk</h1>
    <p>Look up ISO 3166-1 alpha-2 codes for Canada, Mexico, and the United States. No internet connection needed.</p>
    <label for="country-filter">Country name or two-letter code</label>
    <div class="controls">
      <input id="country-filter" type="text" autocomplete="off" spellcheck="false">
      <button id="clear-filter" type="button">Clear filter</button>
    </div>
    <h2>Results</h2>
    <p id="result-status" role="status"></p>
    <ul id="country-results" role="list"></ul>
  </main>
  <script>
    'use strict';
    const countries = [
      ['Canada', 'CA'],
      ['Mexico', 'MX'],
      ['United States', 'US'],
    ];
    const filter = document.getElementById('country-filter');
    const clear = document.getElementById('clear-filter');
    const status = document.getElementById('result-status');
    const results = document.getElementById('country-results');

    function render() {
      const query = filter.value.trim().toLowerCase();
      const matches = countries.filter(([name, code]) =>
        name.toLowerCase().includes(query) || code.toLowerCase() === query
      );
      results.replaceChildren(...matches.map(([name, code]) => {
        const row = document.createElement('li');
        const label = document.createElement('span');
        const badge = document.createElement('strong');
        label.textContent = name;
        badge.textContent = code;
        row.append(label, badge);
        return row;
      }));
      status.textContent = matches.length === 0 ? 'No matching countries.' :
        `${matches.length} ${matches.length === 1 ? 'country' : 'countries'} found.`;
    }

    filter.addEventListener('input', render);
    clear.addEventListener('click', () => {
      filter.value = '';
      render();
      filter.focus();
    });
    render();
  </script>
</body>
</html>
